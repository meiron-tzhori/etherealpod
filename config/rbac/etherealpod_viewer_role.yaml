# This rule is not used by the project ascendra-hw-parta itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to apps.ascendra.local resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ascendra-hw-parta
    app.kubernetes.io/managed-by: kustomize
  name: etherealpod-viewer-role
rules:
- apiGroups:
  - apps.ascendra.local
  resources:
  - etherealpods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps.ascendra.local
  resources:
  - etherealpods/status
  verbs:
  - get
