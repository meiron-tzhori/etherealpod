# This rule is not used by the project ascendra-hw-parta itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over apps.ascendra.local.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ascendra-hw-parta
    app.kubernetes.io/managed-by: kustomize
  name: etherealpod-admin-role
rules:
- apiGroups:
  - apps.ascendra.local
  resources:
  - etherealpods
  verbs:
  - '*'
- apiGroups:
  - apps.ascendra.local
  resources:
  - etherealpods/status
  verbs:
  - get
